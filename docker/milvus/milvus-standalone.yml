# Milvus 单机版（standalone）一键启动：etcd(元数据) + minio(对象存储) + milvus(核心)
# 端口：19530(gRPC，应用连这个) / 9091(HTTP 健康检查)
#
# 用法：
#   cd docker
#   docker compose -f docker/milvus/milvus-standalone.yml up -d
#   docker compose -f docker/milvus/milvus-standalone.yml down   # 停止（数据保留在 volumes 目录）
#
# 启动后，把 application.yml 的 rag.vectorstore.type 改成 milvus 即可启用向量库：
#   rag:
#     vectorstore:
#       type: milvus
#       milvus:
#         host: localhost
#         port: 19530
#         collection: vector_store
#         dimension: 1024   # 必须对齐 bge-m3
version: '3.5'

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-..}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-..}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.4.13
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-..}/volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  # Attu：Milvus 官方可视化客户端（Web GUI），用于浏览集合、向量、检索结果
  # 浏览器打开 http://localhost:8000 即可连接上面的 milvus（默认端口 19530）
  attu:
    container_name: milvus-attu
    image: zilliz/attu:v2.4.9
    ports:
      - "8000:3000"   # 容器内 3000，映射到宿主机 8000
    environment:
      MILVUS_URL: milvus:19530   # 指向同 compose 网络的 milvus 服务
    depends_on:
      - "milvus"

networks:
  default:
    name: milvus
