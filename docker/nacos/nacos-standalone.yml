# Nacos 3.2.3 Standalone（单机模式，内嵌 Derby 数据库）
# 用途：为 Nacos MCP Client 提供服务注册与发现能力
# 启动：docker compose -f docker/nacos/nacos-standalone.yml up -d
# 控制台：http://localhost:8080 （3.x 拆到了独立 8080 端口）
# API：http://localhost:8848 （SDK/客户端连接用这个）

# ===== Nacos 3.x vs 2.x 关键变化 =====
# 1. 控制台端口：8848 → 8080（API 端口 8848 不变）
# 2. 鉴权强制：必须配 NACOS_AUTH_TOKEN + IDENTITY_KEY/VALUE（无法关闭）
# 3. JDK 要求：8+ → 17+（镜像内置，宿主机无需安装）
# 4. API 路径：新增 /nacos/v3/（向下兼容 /v1/ /v2/，老 SDK 照常使用）

version: "3.8"

services:
  nacos:
    image: nacos/nacos-server:v3.2.3
    container_name: nacos-standalone
    restart: unless-stopped
    environment:
      # ---- 运行模式 ----
      - MODE=standalone                        # 单机模式（内嵌 Derby 数据库）

      # ---- 强制鉴权（3.x 必须配置，三个缺一不可）----
      # NACOS_AUTH_TOKEN:    JWT 签名密钥（Base64 编码，长度需 >32 字符）
      # NACOS_AUTH_IDENTITY_KEY:   Server 间 Inner API 身份 Key
      # NACOS_AUTH_IDENTITY_VALUE: Server 间 Inner API 身份 Value
      # 默认管理员用户名：nacos，密码在首次登录控制台时自行设置
      - NACOS_AUTH_TOKEN=VtWI3RWawiflt0tdccZHH83wFJJ16oOdUwZGWr07XsvBaFS6Zern5T0lgjHSCm/E
      - NACOS_AUTH_IDENTITY_KEY=nacos_dev_identity_key
      - NACOS_AUTH_IDENTITY_VALUE=nacos_dev_identity_value

      # ---- JVM 内存 ----
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m

      # ---- 节点标识（单机模式也需配置，填本机 IP）----
      - NACOS_SERVERS=localhost:8848

    # ---- 端口映射（3.x 新增 8080 控制台端口）----
    ports:
      - "8080:8080"       # Nacos 控制台（3.x 独立端口）
      - "8848:8848"       # HTTP API 端口（SDK / 客户端连接用）
      - "9848:9848"       # gRPC 端口（客户端 SDK 内部通信）

    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-..}/volumes/nacos-data:/home/nacos/data    # 持久化服务注册信息
      - ${DOCKER_VOLUME_DIRECTORY:-..}/volumes/nacos-logs:/home/nacos/logs    # 日志持久化（便于排查问题）
