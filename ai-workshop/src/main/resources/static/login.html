<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · AI Workshop</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --line:#e3e8ef; --primary:#3b6cff; --text:#1f2733; --muted:#8a94a6; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:36px 40px;
          width:340px; box-shadow:0 8px 30px rgba(0,0,0,.05); }
  .card h1 { font-size:22px; margin:0 0 4px; color:var(--text); }
  .card .sub { color:var(--muted); font-size:13px; margin:0 0 24px; }
  label { font-size:12px; color:var(--muted); display:block; margin:14px 0 4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
          font-size:14px; outline:none; font-family:inherit; }
  input:focus { border-color:var(--primary); }
  /* 密码框 + 眼睛切换按钮：外层相对定位，眼睛固定在右侧 */
  .pwd-wrap { position:relative; }
  .pwd-wrap input { padding-right:38px; }
  .eye-btn { position:absolute; right:8px; top:50%; transform:translateY(-50%);
             /* ⚠️ 必须覆盖通用 button 规则：width:auto（否则全宽）、margin:0（否则 20px 顶下来）、
                border-radius 收紧（否则被通用 10px 圆角盖住）、line-height:1（SVG 垂直居中） */
             width:auto; margin:0; padding:4px; border:none; border-radius:6px;
             background:none; color:var(--muted); cursor:pointer;
             display:flex; align-items:center; line-height:1; }
  .eye-btn:hover { color:var(--primary); }
  button { width:100%; margin-top:20px; padding:11px; border:none; border-radius:10px;
           background:var(--primary); color:#fff; font-size:15px; cursor:pointer; }
  button:hover { filter:brightness(1.05); }
  button:disabled { opacity:.5; cursor:default; }
  #msg { min-height:18px; font-size:12px; color:#e5484d; margin-top:12px; text-align:center; }
  .tip { color:var(--muted); font-size:12px; margin-top:20px; text-align:center; line-height:1.6; }
</style>
</head>
<body>
<div class="card">
  <h1>🤖 AI Workshop</h1>
  <p class="sub">综合知识库 + 自主任务 Agent 工作台 · 演示系统</p>

  <label for="username">用户名</label>
  <input id="username" autocomplete="username" placeholder="请输入用户名">

  <label for="password">密码</label>
  <div class="pwd-wrap">
    <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码">
    <!-- 眼睛：点击切换明文/密文（type=password ↔ type=text） -->
    <button type="button" class="eye-btn" id="eyeBtn" onclick="togglePwd()" aria-label="显示/隐藏密码">
      <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
      </svg>
      <svg id="eyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </button>
  </div>

  <button id="loginBtn" onclick="doLogin()">登 录</button>
  <div id="msg"></div>

  <p class="tip">演示账号由管理员分配<br>注册暂未开放</p>
</div>

<script src="auth.js"></script>
<script>
  // 已登录直接进系统
  if (getToken()) { location.href = '/index.html'; }

  const username = document.getElementById('username');
  const password = document.getElementById('password');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('loginBtn');

  // 回车提交
  [username, password].forEach(el => el.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  }));

  // 密码明文/密文切换（预览）
  function togglePwd() {
    const showing = password.type === 'text';
    password.type = showing ? 'password' : 'text';
    // 同步切换眼睛图标：睁眼=明文显示中，闭眼=密文
    document.getElementById('eyeOpen').style.display = showing ? '' : 'none';
    document.getElementById('eyeClosed').style.display = showing ? 'none' : '';
    password.focus();   // 切完焦点留在输入框，不打断输入
  }

  async function doLogin() {
    if (!username.value.trim() || !password.value) {
      msg.textContent = '请输入用户名和密码';
      return;
    }
    btn.disabled = true;
    msg.textContent = '';
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username.value.trim(), password: password.value })
      });
      const d = await r.json();
      if (r.ok && d.token) {
        setToken(d.token);
        location.href = '/index.html';
      } else {
        msg.textContent = d.message || '登录失败';
      }
    } catch (e) {
      msg.textContent = '网络错误，请重试';
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
