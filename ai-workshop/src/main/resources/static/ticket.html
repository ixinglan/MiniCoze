<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>结构化输出 · 自然语言 → 工单</title>
    <script src="auth.js"></script>   <!-- 阶段 9：未登录自动跳登录页 + fetch 自动带 token -->
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
               max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1f2329; background: #f7f8fa; }
        h1 { font-size: 22px; margin-bottom: 4px; }
        .sub { color: #8a9099; font-size: 13px; margin-bottom: 20px; }
        textarea { width: 100%; height: 110px; padding: 12px; border: 1px solid #dcdfe6;
                   border-radius: 8px; font-size: 14px; resize: vertical; outline: none; }
        textarea:focus { border-color: #4c8bf5; }
        .row { display: flex; gap: 10px; align-items: center; margin: 14px 0; }
        button { background: #4c8bf5; color: #fff; border: none; padding: 10px 22px;
                 border-radius: 8px; font-size: 14px; cursor: pointer; }
        button:disabled { opacity: .6; cursor: not-allowed; }
        a { color: #4c8bf5; font-size: 13px; text-decoration: none; }
        pre { background: #1f2329; color: #e6e6e6; padding: 16px; border-radius: 8px;
              font-size: 13px; line-height: 1.6; overflow: auto; min-height: 60px; white-space: pre-wrap; }
        .hint { font-size: 12px; color: #b0b4bb; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>自然语言 → 结构化工单</h1>
    <div class="sub">阶段 2 演示：用 PromptTemplate + BeanOutputConverter 把一句话需求解析成规整对象</div>

    <textarea id="input" placeholder="试着输入：周五前帮我写个登录接口压测脚本，优先级高，分类运维，记得@一下测试同学跟进"></textarea>

    <div class="row">
        <button id="btn" onclick="parse()">解析成工单</button>
        <a href="/">← 返回聊天</a>
    </div>

    <pre id="output">// 解析结果会显示在这里</pre>
    <div class="hint">接口：POST /api/parse/ticket ｜ body: { "text": "..." }</div>

    <script>
        async function parse() {
            const text = document.getElementById('input').value.trim();
            const btn = document.getElementById('btn');
            const out = document.getElementById('output');
            if (!text) { out.textContent = '// 请先输入需求文本'; return; }
            btn.disabled = true; out.textContent = '// 解析中…';
            try {
                const res = await fetch('/api/parse/ticket', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                if (!res.ok) {
                    out.textContent = '// 请求失败 HTTP ' + res.status + '\n' + await res.text();
                    return;
                }
                const data = await res.json();
                out.textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                out.textContent = '// 出错：' + e.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
