spring:
  application:
    name: ai-workshop
  # 流式（NDJSON / SSE）响应可能较长时间不结束：放宽异步请求超时，避免向量化中途被 Tomcat 断开
  mvc:
    async:
      request-timeout: 600000   # 10 分钟
  # ===== 数据源：MySQL 持久化对话记忆（库已手动建好 mini_coze）=====
  datasource:
    url: jdbc:mysql://localhost:3306/mini_coze?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 启动时自动执行 src/main/resources/schema.sql 建表（IF NOT EXISTS，可重复跑）
  sql:
    init:
      mode: always
  # ===== MyBatis-Plus：替代原生 JdbcTemplate，用 BaseMapper + QueryWrapper 操作 =====
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
  ai:
    # ===== 模型 1：DeepSeek V4（对话）=====
    # 注意：DeepSeek V4 公开 API（api.deepseek.com）至今为 text-only，不支持图片输入。
    # 图片理解（阶段 5 看图说话）改用通义千问视觉模型 qwen-vl-max（见下方 dashscope.chat）。
    deepseek:
      # 推荐用环境变量注入，避免把密钥写进代码/仓库
      api-key: ${AI_DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash   # 或 deepseek-v4-pro（更强/更贵）

    # ===== 模型 2：Ollama 本地（阶段 3 RAG 向量化 + 离线模式生成）=====
    # embedding 始终启用（bge-m3 负责向量化）；chat 保持启用以便离线模式切换为本地 LLM
    ollama:
      base-url: http://localhost:11434
      chat:
        enabled: true     # 启用后注入 ollamaChatModel Bean；在线模式不使用它，离线模式才切到它
        options:
          model: ${RAG_OFFLINE_MODEL:qwen2.5:1.5b}   # 离线生成用本地模型，按需改成 deepseek-r1 / llama3.1 等
      embedding:
        enabled: true
        options:
          model: bge-m3   # 中文 RAG 推荐；也可换 nomic-embed-text（768 维，更轻量）

    # ===== 模型 3：阿里云 DashScope（阶段 5：图片理解 qwen-vl-max + 文生图通义万相 Wanx）=====
    # DashScope starter 自动配置两个 Bean：dashScopeChatModel（ChatModel，用于视觉理解）
    # 与 dashScopeImageModel（ImageModel，用于文生图）。两者互不冲突。
    dashscope:
      # 推荐用环境变量注入，避免把密钥写进代码/仓库
      api-key: ${AI_DASHSCOPE_API_KEY:}
      # 文生图是异步任务（先提交任务，再后台轮询状态），生成慢时默认 10 次重试不够，放大避免 "still pending" 误判失败
      retry:
        max-attempts: 20
        backoff:
          initial-interval: 3s
          multiplier: 2
          max-interval: 15s
      # 图片理解（看图说话）：必须指定视觉模型 + 开启 multi-model，否则请求打到文本端点、图片被丢弃
      chat:
        options:
          model: qwen-vl-max          # 通义千问视觉模型，支持图片输入
          multi-model: true           # 关键开关：走多模态端点；缺省会当成纯文本请求导致"看不到图"
      image:
        options:
          model: wanx2.0-t2i-turbo        # 通义万相；可选 wanx2.0-t2i-turbo（更快/更便宜）
          size: 1024*1024       # 输出分辨率

    # 阶段 7 参考文档：https://nacos.io/docs/latest/manual/user/ai/mcp-auto-register/?spm=5238cd80.297dad21.0.0.271de37eSClDtZ
    # ===== 阶段 7 MCP Client 配置（两路并行）=====
    # stdio：启动 Python MCP Server 进程，通过标准输入/输出通信
    # nacos：通过 Nacos 服务发现自动找到 Nacos MCP Server 的 SSE 端点
    mcp:
      client:
        enabled: true
        name: ai-workshop-mcp-client
        version: 1.0.0
        toolcallback:
          enabled: true
        type: async                   # 异步模式（支持 SSE/stdio 并发）
        # ---- stdio 连接：Python MCP Server ----
        stdio:
          connections:
            python-tools-server:
              command: ${MCP_PYTHON_PATH:python}
              args:
                - ${MCP_PYTHON_SERVER:/Users/ixiaoqiang/WorkBuddy/springAi/mcp-servers/python-server/server.py}
        sse:
          connections:
            nacos-mcp-server:
              # 实际还是 sse 连接原始 mcp server
              url: ${MCP_NACOS_URL:http://localhost:9988}
              sse-endpoint: ${MCP_NACOS_SSE_ENDPOINT:/sse}

    # ---- Nacos MCP 服务发现（Nacos 3.x，8848 是 API 端口，非控制台端口）----
    # nacos 现在要做 mcp 自动发现需要再安装一个 mcp-router, 先不用这个配置
#    alibaba:
#      mcp:
#        nacos:
#          server-addr: ${NACOS_ADDR:localhost:8848}
#          namespace: public                     # Nacos 命名空间 ID（public 即留空）
#          username: nacos                       # Nacos 3.x 强制鉴权
#          password: ${NACOS_PASSWORD:123456}
#          client:
#            enabled: true
#            sse:
#              connections:
#                server1:
#                  service-name: mcp-nacos-server   # 对应 Nacos 中注册的 MCP Server 服务名
#                  version: 1.0.0                   # 对应 MCP Server 的版本号

    # ===== 阶段 8 可观测：把 Prompt / 回复内容写进观测（供 Langfuse 展示输入输出）=====
    # 注意：默认 false 是出于隐私考虑（内容可能含敏感信息）；本地学习全开，生产按需。
    chat:
      observations:
        log-prompt: true
        log-completion: true

server:
  port: 9999

# ===== 阶段 8 可观测：Langfuse 链路追踪（OTLP 导出）=====
# 前置：docker compose -f docker/langfuse-standalone.yml up -d（UI http://localhost:3000）
# 机制：Spring AI 的每个模型调用 Observation 会经 Micrometer Tracing → OpenTelemetry
#       → OTLP 导出到 Langfuse；下方 Authorization 是 Langfuse project 的 public:secret key 的 Base64。
# 若暂时不想追踪，把 spring.ai.chat.observations 两行改 false 或注释掉 management 段即可（代码零改动）。
management:
  tracing:
    sampling:
      probability: 1.0                 # 采样率：本地学习 100% 采样；生产建议 0.1 降成本
  otlp:
    tracing:
      endpoint: ${LANGFUSE_OTLP_ENDPOINT:http://localhost:3000/api/public/otel/v1/traces}
      # ⚠️ 必须带 /v1/traces：Spring Boot 的 OTLP 配置是完整 URL（不会自动拼接路径），
      #    只写 /api/public/otel 会 404（已 curl 实测：带 /v1/traces 才 200）
      transport: http                  # Langfuse 只支持 OTLP over HTTP（gRPC 不支持）
      headers:
        Authorization: "Basic cGstbGYtN2UwYjZiMzRkNGM4NTk5Mzpzay1sZi00YjI2MzM0OTU0ODczODNhNjc5NWIxM2ZhY2JjMWQzMw=="
        x-langfuse-ingestion-version: "4"   # 实时摄入（不加最多延迟 10 分钟）
    metrics:
      export:
        enabled: false                 # 只导 trace，metrics 不往 Langfuse 发（避免 404 报错）

# ===== RAG 文件管理 / 向量库 / 离线模式配置 =====
rag:
  storage:
    dir: ./data/rag-files        # 上传文件落盘目录（元数据在 rag_file 表，文件本体在此）
  seed:
    force-reindex: false         # false：milvus 模式若集合已非空则跳过种子索引（防每次启动重复插入）；true：强制重建
  vectorstore:
    type: milvus                 # memory（默认，零依赖）| milvus（docker 起 Milvus 后切换）
    milvus:
      host: localhost
      port: 19530
      collection: vector_store   # Milvus 集合名（首次自动创建）
      dimension: 1024            # 必须对齐 bge-m3 的向量维度，错配会导致建集合失败
  offline:
    enabled: false              # true 时生成改用本地 Ollama LLM，实现完全离线问答

logging:
  level:
    org.springframework.ai: INFO

