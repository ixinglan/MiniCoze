<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识库问答 · AI Workshop</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
           background: #f5f7fa; color: #1f2937; }
    .topbar { display: flex; align-items: center; justify-content: space-between;
              padding: 12px 20px; background: #fff; border-bottom: 1px solid #e5e7eb; }
    .topbar h1 { font-size: 16px; margin: 0; font-weight: 600; }
    .topbar a { font-size: 13px; color: #185fa5; text-decoration: none; }
    .topbar a:hover { text-decoration: underline; }
    .hint { padding: 8px 20px; font-size: 12px; color: #6b7280; background: #eef2ff; }
    #chat { max-width: 760px; margin: 16px auto; padding: 0 16px;
            display: flex; flex-direction: column; gap: 12px; }
    .msg { padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap;
           word-break: break-word; max-width: 85%; }
    .user { align-self: flex-end; background: #185fa5; color: #fff; border-bottom-right-radius: 4px; }
    .bot  { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
    .inputbar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 8px;
                padding: 12px 16px; background: #fff; border-top: 1px solid #e5e7eb; }
    .inputbar input { flex: 1; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px;
                      font-size: 14px; outline: none; }
    .inputbar button { padding: 10px 18px; border: none; border-radius: 8px; background: #185fa5;
                       color: #fff; font-size: 14px; cursor: pointer; }
    .inputbar button:disabled { opacity: .6; cursor: not-allowed; }
    .spacer { height: 80px; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>📚 知识库问答（RAG）</h1>
    <a href="/">← 返回聊天</a>
  </div>
  <div class="hint">基于本地知识库（rag-docs）检索回答。试试："AI Workshop 有哪些功能模块？"、"年假有几天？"、"为什么用 bge-m3 做向量化？"</div>
  <div id="chat"></div>
  <div class="spacer"></div>
  <div class="inputbar">
    <input id="msg" placeholder="输入问题，回车发送" autofocus />
    <button id="send">发送</button>
  </div>

  <script>
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('msg');
    const sendBtn = document.getElementById('send');

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.textContent = text;          // 用 textContent 防 XSS
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function send() {
      const text = inputEl.value.trim();
      if (!text) return;
      addBubble('user', text);
      inputEl.value = '';
      sendBtn.disabled = true;

      const botBubble = addBubble('bot', '');

      const es = new EventSource('/api/rag/stream?message=' + encodeURIComponent(text) + '&conversationId=rag');
      es.onmessage = (e) => {
        if (e.data === '[DONE]') { es.close(); sendBtn.disabled = false; return; }
        botBubble.textContent += e.data; chatEl.scrollTop = chatEl.scrollHeight;
      };
      es.onerror = () => {
        if (!botBubble.textContent) botBubble.textContent = '（请求失败，请确认已配置 DeepSeek Key 且本地 Ollama 已启动 bge-m3）';
        es.close(); sendBtn.disabled = false;
      };
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
