spring:
  application:
    name: ai-workshop
  # 流式（NDJSON / SSE）响应可能较长时间不结束：放宽异步请求超时，避免向量化中途被 Tomcat 断开
  mvc:
    async:
      request-timeout: 600000   # 10 分钟
  # ===== 数据源：MySQL 持久化对话记忆（库已手动建好 mini_coze）=====
  datasource:
    url: jdbc:mysql://localhost:3306/mini_coze?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 启动时自动执行 src/main/resources/schema.sql 建表（IF NOT EXISTS，可重复跑）
  sql:
    init:
      mode: always
  # ===== MyBatis-Plus：替代原生 JdbcTemplate，用 BaseMapper + QueryWrapper 操作 =====
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
  ai:
    # ===== 模型 1：DeepSeek V4（对话 + 视觉理解）=====
    deepseek:
      # 推荐用环境变量注入，避免把密钥写进代码/仓库
      api-key: ${AI_DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash   # 或 deepseek-v4-pro（更强/更贵）；V4 原生支持图片输入

    # ===== 模型 2：Ollama 本地（阶段 3 RAG 向量化 + 离线模式生成）=====
    # embedding 始终启用（bge-m3 负责向量化）；chat 保持启用以便离线模式切换为本地 LLM
    ollama:
      base-url: http://localhost:11434
      chat:
        enabled: true     # 启用后注入 ollamaChatModel Bean；在线模式不使用它，离线模式才切到它
        options:
          model: ${RAG_OFFLINE_MODEL:qwen2.5:1.5b}   # 离线生成用本地模型，按需改成 deepseek-r1 / llama3.1 等
      embedding:
        enabled: true
        options:
          model: bge-m3   # 中文 RAG 推荐；也可换 nomic-embed-text（768 维，更轻量）

server:
  port: 9999

# ===== RAG 文件管理 / 向量库 / 离线模式配置 =====
rag:
  storage:
    dir: ./data/rag-files        # 上传文件落盘目录（元数据在 rag_file 表，文件本体在此）
  seed:
    force-reindex: false         # false：milvus 模式若集合已非空则跳过种子索引（防每次启动重复插入）；true：强制重建
  vectorstore:
    type: milvus                 # memory（默认，零依赖）| milvus（docker 起 Milvus 后切换）
    milvus:
      host: localhost
      port: 19530
      collection: vector_store   # Milvus 集合名（首次自动创建）
      dimension: 1024            # 必须对齐 bge-m3 的向量维度，错配会导致建集合失败
  offline:
    enabled: false              # true 时生成改用本地 Ollama LLM，实现完全离线问答

logging:
  level:
    org.springframework.ai: INFO
