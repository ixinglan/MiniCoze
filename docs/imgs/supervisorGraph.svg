<svg viewBox="0 0 680 510" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="680" height="510" fill="#ffffff"/>

  <text x="340" y="22" text-anchor="middle" font-size="14" font-weight="500" fill="#854F0B" font-family="sans-serif">supervisorGraph（监督者多智能体循环）</text>

  <circle cx="340" cy="52" r="18" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
  <text x="340" y="57" text-anchor="middle" font-size="11" fill="#633806" font-weight="500" dominant-baseline="central" font-family="sans-serif">START</text>

  <line x1="340" y1="70" x2="340" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="160" y="88" width="360" height="72" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="340" y="108" text-anchor="middle" font-size="14" font-weight="500" fill="#633806" dominant-baseline="central" font-family="sans-serif">supervisor（监督者）</text>
  <text x="340" y="128" text-anchor="middle" font-size="11" fill="#BA7517" dominant-baseline="central" font-family="sans-serif">LLM 决定: researcher / coder / FINISH</text>
  <text x="340" y="146" text-anchor="middle" font-size="11" fill="#BA7517" dominant-baseline="central" font-family="sans-serif">step≥3 强制 FINISH（安全网）</text>

  <line x1="230" y1="160" x2="230" y2="198" stroke="#5F5E5A" stroke-width="1.5"/>
  <line x1="450" y1="160" x2="450" y2="198" stroke="#5F5E5A" stroke-width="1.5"/>
  <line x1="230" y1="180" x2="450" y2="180" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="340" y="194" text-anchor="middle" font-size="11" fill="#5F5E5A" dominant-baseline="central" font-family="sans-serif">条件边: 读 state.next 动态选路</text>

  <line x1="230" y1="180" x2="230" y2="202" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="180" x2="450" y2="202" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="110" y="206" width="160" height="56" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="190" y="226" text-anchor="middle" font-size="14" font-weight="500" fill="#0C447C" dominant-baseline="central" font-family="sans-serif">researcher</text>
  <text x="190" y="246" text-anchor="middle" font-size="11" fill="#185FA5" dominant-baseline="central" font-family="sans-serif">研究员 Agent</text>

  <rect x="410" y="206" width="160" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="490" y="226" text-anchor="middle" font-size="14" font-weight="500" fill="#085041" dominant-baseline="central" font-family="sans-serif">coder</text>
  <text x="490" y="246" text-anchor="middle" font-size="11" fill="#0F6E56" dominant-baseline="central" font-family="sans-serif">程序员 Agent</text>

  <!-- Loop-back arrows -->
  <path d="M110,234 C70,234 40,220 40,130 C40,100 60,88 160,88" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="60" y="200" text-anchor="middle" font-size="11" fill="#534AB7" dominant-baseline="central" font-family="sans-serif">回环</text>

  <path d="M570,234 C610,234 640,220 640,130 C640,100 620,88 520,88" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="654" y="200" text-anchor="middle" font-size="11" fill="#0F6E56" dominant-baseline="central" font-family="sans-serif">回环</text>

  <!-- FINISH exit -->
  <rect x="270" y="310" width="140" height="36" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="333" text-anchor="middle" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central" font-family="sans-serif">FINISH</text>

  <line x1="340" y1="160" x2="340" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="346" x2="340" y2="386" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <circle cx="340" cy="404" r="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
  <text x="340" y="409" text-anchor="middle" font-size="11" fill="#2C2C2A" font-weight="500" dominant-baseline="central" font-family="sans-serif">END</text>

  <rect x="130" y="450" width="420" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="340" y="473" text-anchor="middle" font-size="12" fill="#2C2C2A" dominant-baseline="central" font-family="sans-serif">KeyStrategy: result=AppendStrategy（多轮追加），其余=ReplaceStrategy</text>
</svg>
